<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一般常識クイズ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">

    <!-- スタート画面 -->
    <div id="start-screen" class="screen">
      <h1 class="title">一般常識クイズ</h1>
      <p class="subtitle">全5問・4択形式</p>
      <button id="start-btn" class="btn btn-primary">スタート</button>
    </div>

    <!-- クイズ画面 -->
    <div id="quiz-screen" class="screen hidden">
      <div class="progress-bar-wrap">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
      <p id="question-number" class="question-number"></p>
      <p id="question-text" class="question-text"></p>
      <div id="choices" class="choices"></div>
      <div id="feedback" class="feedback hidden">
        <p id="feedback-text"></p>
        <p id="explanation"></p>
        <button id="next-btn" class="btn btn-primary">次の問題へ</button>
      </div>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen" class="screen hidden">
      <h2 class="result-title">結果発表</h2>
      <p id="score-text" class="score-text"></p>
      <p id="score-comment" class="score-comment"></p>
      <button id="retry-btn" class="btn btn-primary">もう一度挑戦</button>
    </div>

  </div>
  <script src="script.js"></script>
</body>
</html>
